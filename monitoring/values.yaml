kube-prometheus-stack:
  grafana:
    # requests 미설정 시 BestEffort가 되어 메모리 압박 때 먼저 축출된다
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi
    # admin 계정은 SealedSecret(grafana-admin, templates/grafana-admin-secret.yaml)에서 읽는다 (평문 금지)
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        # cert-manager가 사설 CA(wafer-ca)로 TLS 인증서를 발급한다
        cert-manager.io/cluster-issuer: wafer-ca
      hosts:
        - grafana.wafer.local
      paths:
        - /
      tls:
        - secretName: grafana-wafer-local-tls
          hosts:
            - grafana.wafer.local
    grafana.ini:
      analytics:
        check_for_updates: false
      server:
        # 공유 링크·리다이렉트 주소. NodePort로만 접속한다면 https://grafana.wafer.local:32443/ (RUNBOOK C13)
        root_url: https://grafana.wafer.local/
      security:
        # frontend Monitoring 페이지가 대시보드를 iframe으로 띄운다
        allow_embedding: true
        cookie_secure: true
        disable_gravatar: true
      # frontend 임베드를 위해 읽기 전용(Viewer) anonymous는 유지하고, 노출 범위를 줄인다
      auth.anonymous:
        enabled: true
        org_role: Viewer
        hide_version: true
      explore:
        enabled: false
      users:
        allow_sign_up: false
      date_formats:
        default_timezone: Asia/Seoul

    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        backend-ai:
