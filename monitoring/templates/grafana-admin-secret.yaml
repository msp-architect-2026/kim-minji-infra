{{- $enc := .Values.grafanaAdmin.sealedSecret.encryptedData -}}
{{- range $k := list "admin-user" "admin-password" }}
{{- if not (get $enc $k) }}
{{- fail (printf "grafanaAdmin.sealedSecret.encryptedData.%s is required (kubeseal로 암호화한 값)" $k) }}
{{- end }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.grafanaAdmin.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{- toYaml $enc | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.grafanaAdmin.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
