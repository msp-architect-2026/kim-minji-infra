# 서비스별 알림 규칙. CrashLoop·노드 다운·HPA 최대·PVC 용량·Job 실패는 kube-prometheus-stack 기본 규칙
# (KubePodCrashLooping, KubeNodeNotReady, KubeHpaMaxedOut, KubePersistentVolumeFillingUp, KubeJobFailed)을 쓴다.
# release 라벨: Prometheus의 ruleSelector가 이 릴리스의 규칙만 읽는다
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wafer-rules
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  groups:
    - name: wafer.backend
      rules:
        - alert: BackendDown
          expr: up{job="{{ .Values.alertRules.backendJob }}"} == 0 or absent(up{job="{{ .Values.alertRules.backendJob }}"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: backend 메트릭 수집 실패 (Pod 다운 또는 스크레이프 불가)
            description: "{{`{{ $labels.instance }}`}}"
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="{{ .Values.alertRules.backendJob }}",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{job="{{ .Values.alertRules.backendJob }}"}[5m])) > {{ .Values.alertRules.errorRatio }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: backend 5xx 비율이 {{ mul .Values.alertRules.errorRatio 100 }}%를 넘음
            description: "현재 {{`{{ $value | humanizePercentage }}`}}"
        - alert: BackendHighLatency
          # 평균 응답시간 (p95는 히스토그램 활성화 후 SLO 항목에서 대체)
          expr: |
            sum(rate(http_server_requests_seconds_sum{job="{{ .Values.alertRules.backendJob }}",uri!~"/actuator.*"}[5m]))
              / sum(rate(http_server_requests_seconds_count{job="{{ .Values.alertRules.backendJob }}",uri!~"/actuator.*"}[5m])) > {{ .Values.alertRules.backendLatencySeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: backend 평균 응답시간이 {{ .Values.alertRules.backendLatencySeconds }}초를 넘음
            description: "현재 {{`{{ $value | humanizeDuration }}`}}"
        - alert: BackendCircuitBreakerOpen
          expr: max by (name) (resilience4j_circuitbreaker_state{job="{{ .Values.alertRules.backendJob }}",state="open"}) == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "backend → AI 서빙 Circuit Breaker OPEN ({{`{{ $labels.name }}`}})"
            description: AI 서빙 호출이 차단되어 추론 요청이 503으로 응답 중
    - name: wafer.ai-serving
      rules:
        - alert: AIServingDown
          expr: up{job="{{ .Values.alertRules.aiJob }}"} == 0 or absent(up{job="{{ .Values.alertRules.aiJob }}"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: ai-serving 메트릭 수집 실패 (Pod 다운 또는 스크레이프 불가)
            description: "{{`{{ $labels.instance }}`}}"
        - alert: AIInferenceErrors
          expr: |
            sum(rate(http_requests_total{job="{{ .Values.alertRules.aiJob }}",handler="/predict",status="5xx"}[5m]))
              / sum(rate(http_requests_total{job="{{ .Values.alertRules.aiJob }}",handler="/predict"}[5m])) > {{ .Values.alertRules.errorRatio }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AI 추론(/predict) 에러 비율이 {{ mul .Values.alertRules.errorRatio 100 }}%를 넘음
            description: "현재 {{`{{ $value | humanizePercentage }}`}}"
        - alert: AIInferenceSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ .Values.alertRules.aiJob }}",handler="/predict"}[5m])))
              > {{ .Values.alertRules.aiP95Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AI 추론(/predict) p95가 {{ .Values.alertRules.aiP95Seconds }}초를 넘음
            description: "현재 {{`{{ $value | humanizeDuration }}`}}"
    - name: wafer.backup
      rules:
        - alert: BackupJobFailed
          expr: kube_job_status_failed{namespace="storage",job_name=~"(mysql-backup|minio-backup|mysql-restore-check).*"} > 0
          labels:
            severity: critical
          annotations:
            summary: "백업·복원 검증 Job 실패 ({{`{{ $labels.job_name }}`}})"
            description: "kubectl -n storage logs job/{{`{{ $labels.job_name }}`}}"
        - alert: BackupNotRecent
          expr: time() - max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="storage",cronjob=~"mysql-backup|minio-backup"}) > {{ .Values.alertRules.backupMaxAgeHours }} * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{`{{ $labels.cronjob }}`}} 마지막 성공이 {{ .Values.alertRules.backupMaxAgeHours }}시간 넘게 지남"
            description: "마지막 성공 후 {{`{{ $value | humanizeDuration }}`}}"
        - alert: RestoreCheckNotRecent
          expr: time() - kube_cronjob_status_last_successful_time{namespace="storage",cronjob="mysql-restore-check"} > 8 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 주간 복원 검증이 8일 넘게 성공하지 않음
            description: "kubectl -n storage get jobs -l app.kubernetes.io/component=restore-check"
