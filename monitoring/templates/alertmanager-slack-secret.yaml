{{- if not (get .Values.alertmanagerSlack.sealedSecret.encryptedData "webhook-url") }}
{{- fail "alertmanagerSlack.sealedSecret.encryptedData.webhook-url is required (kubeseal로 암호화한 Slack Incoming Webhook URL, RUNBOOK 5.4)" }}
{{- end }}
# Alertmanager가 alertmanagerSpec.secrets로 마운트한다 (/etc/alertmanager/secrets/alertmanager-slack/webhook-url)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.alertmanagerSlack.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{- toYaml .Values.alertmanagerSlack.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.alertmanagerSlack.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
