stages:
  - build

build-backup-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"gitlab.local:5050\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context ${CI_PROJECT_DIR}/backup
      --dockerfile ${CI_PROJECT_DIR}/backup/Dockerfile
      --destination gitlab.local:5050/${CI_PROJECT_PATH}/mysql-backup:${CI_COMMIT_SHORT_SHA}
  only:
    changes:
      - backup/Dockerfile

# 파이프라인의 어떤 job이든 실패하면 Slack으로 알린다
# SLACK_WEBHOOK_URL: GitLab CI/CD 변수(masked)에 Incoming Webhook URL을 넣는다. 없으면 건너뛴다
notify_failure:
  stage: .post
  image: curlimages/curl:8.22.0
  when: on_failure
  script:
    - |
      if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "경고: SLACK_WEBHOOK_URL 없음(미설정이거나 Protected 변수라 이 브랜치에서 안 보임) → 알림 생략"; exit 0; fi
      # 브랜치명의 " \ 는 JSON이 깨지지 않게 이스케이프
      REF=$(printf '%s' "$CI_COMMIT_REF_NAME" | sed 's/["\\]/\\&/g')
      TEXT=":rotating_light: *GitLab CI 실패* ${CI_PROJECT_NAME} \`${REF}\` (${CI_COMMIT_SHORT_SHA}) by ${GITLAB_USER_LOGIN}\n${CI_PIPELINE_URL}"
      printf '{"text":"%s"}' "$TEXT" > /tmp/payload.json
      curl -fsS -X POST -H 'Content-Type: application/json' --data @/tmp/payload.json "$SLACK_WEBHOOK_URL"
