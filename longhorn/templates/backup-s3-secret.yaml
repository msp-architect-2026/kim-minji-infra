{{- with .Values.backupS3.sealedSecret.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Values.backupS3.secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $.Values.backupS3.secretName }}
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
