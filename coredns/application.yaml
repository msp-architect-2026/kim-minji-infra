apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: gitops
spec:
  project: default
  source:
    repoURL: http://gitlab.local:8929/root/kim-minji-infra.git
    targetRevision: HEAD
    path: coredns
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
