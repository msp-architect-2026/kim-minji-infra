# network-policy chart values

# Ingress 컨트롤러(Traefik)가 뜨는 네임스페이스. 앱으로 들어오는 외부 트래픽은 여기서만 허용한다
ingressControllerNamespace: traefik

# 기본 차단(ingress+egress) + DNS egress 허용을 적용할 네임스페이스
defaultDenyNamespaces:
  - application
  - ai-serving
  - storage

# 백업 Job(storage)이 외부 S3 호환 저장소로 나가는 경로. 포트는 백업 대상 엔드포인트에 맞춘다 (RUNBOOK C16)
backupExternalEgress:
  enabled: true
  ports:
    - 443   # HTTPS S3 (AWS, B2, R2 등)
    - 9000  # 맥 호스트·NAS의 MinIO
  # Pod·Service 대역(Calico 10.42.0.0/16, k3s Service 10.43.0.0/16)은 제외 — 클러스터 내부는 기존 규칙으로만
  exceptCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
