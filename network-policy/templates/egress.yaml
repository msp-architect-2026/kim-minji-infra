# backend → mysql(3306), minio(9000), ai-serving(8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: storage
      podSelector:
        matchLabels:
          app.kubernetes.io/name: mysql
    ports:
    - protocol: TCP
      port: 3306
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: storage
      podSelector:
        matchLabels:
          app.kubernetes.io/name: minio
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-serving
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ai-serving
    ports:
    - protocol: TCP
      port: 8000
---
# ai-serving → minio(9000): 모델 파일 다운로드
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-serving-egress
  namespace: ai-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-serving
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: storage
      podSelector:
        matchLabels:
          app.kubernetes.io/name: minio
    ports:
    - protocol: TCP
      port: 9000
---
# storage 내부: 백업 CronJob → mysql(3306), minio(9000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-internal-egress
  namespace: storage
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3306
    - protocol: TCP
      port: 9000
