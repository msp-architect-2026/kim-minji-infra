{{- if .Values.mesh.enabled }}
{{- range .Values.mesh.namespaces }}
{{- if has . $.Values.defaultDenyNamespaces }}
---
# sidecar(istio-proxy) → istiod: xDS 설정과 워크로드 인증서
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-sidecar-egress
  namespace: {{ . }}
spec:
  podSelector:
    matchExpressions:
      - key: security.istio.io/tlsMode
        operator: Exists
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          app: istiod
    ports:
    - protocol: TCP
      port: 15012
{{- end }}
{{- end }}
{{- end }}
