apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wafer-app-ingress
  namespace: application
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if .Values.tls.enabled }}
  tls:
    - secretName: wafer-app-ingress-tls
      hosts:
        - {{ .Values.ingress.app.host }}
        - {{ .Values.ingress.api.host }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.app.serviceName }}
                port:
                  number: {{ .Values.ingress.app.servicePort }}
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.api.serviceName }}
                port:
                  number: {{ .Values.ingress.api.servicePort }}
