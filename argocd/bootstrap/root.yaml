# App of Apps: argocd/apps 아래의 ApplicationSet을 배포한다.
# 클러스터에 최초 1회만 직접 적용한다 (RUNBOOK 참고). 이후 변경은 Git으로만.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: gitops
spec:
  project: default
  source:
    repoURL: http://gitlab.local:8929/root/kim-minji-infra.git
    targetRevision: HEAD
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
