# 클러스터 공통 인프라(kim-minji-infra 차트)를 프로파일별로 배포한다.
# 프로파일: in-cluster 클러스터 Secret의 env 라벨 (dev | full). 라벨이나 Secret이 없으면 dev.
#   values.yaml(공통) → values-<env>.yaml(있으면) 순서로 덮어쓴다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: gitops
spec:
  goTemplate: true
  syncPolicy:
    # ApplicationSet을 지워도 이미 배포된 리소스는 남긴다
    preserveResourcesOnDeletion: true
  # 유지보수(RUNBOOK 4.12) 때 Application의 자동 sync를 kubectl로 잠시 끌 수 있게, 이 필드만은 ApplicationSet이 되돌리지 않는다
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated
  generators:
    # 주의: clusters 생성기도 .name(클러스터 이름)을 내보내고 matrix에서 우선한다. 차트 이름은 .chart로 쓴다.
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                # 플랫폼 기반 (항목 2): 다른 앱보다 먼저 준비돼야 한다. 순서 제어는 sync wave 항목에서 다룬다
                # CNI (#242): tigera-operator. 새 클러스터에서는 ArgoCD보다 먼저 helm으로 설치하고 이 Application이 이어받는다 (RUNBOOK 3.1)
                - chart: calico
                  namespace: tigera-operator
                  serverSideApply: "true"
                - chart: sealed-secrets
                  namespace: kube-system
                  serverSideApply: "false"
                - chart: metallb
                  namespace: metallb-system
                  serverSideApply: "true"
                - chart: cert-manager
                  namespace: cert-manager
                  serverSideApply: "true"
                - chart: longhorn
                  namespace: longhorn-system
                  serverSideApply: "true"
                - chart: traefik
                  namespace: traefik
                  serverSideApply: "true"
                # 항목 8: AI 서빙 스케일링·카나리
                - chart: keda
                  namespace: keda
                  serverSideApply: "true"
                - chart: argo-rollouts
                  namespace: argo-rollouts
                  serverSideApply: "true"
                # Outlier Detection 실험 (RUNBOOK 4.15): experiment 라벨이 mesh·mesh-retry일 때만 렌더링, 평소에는 빈 Application
                - chart: istio
                  namespace: istio-system
                  serverSideApply: "true"
                - chart: coredns
                  namespace: kube-system
                  serverSideApply: "true"
                - chart: node-local-dns
                  namespace: kube-system
                  serverSideApply: "false"
                - chart: network-policy
                  namespace: default
                  serverSideApply: "false"
                - chart: ingress
                  namespace: application
                  serverSideApply: "false"
                - chart: monitoring
                  namespace: monitoring
                  serverSideApply: "true"
                - chart: loki
                  namespace: monitoring
                  serverSideApply: "false"
                # 항목 9: 트레이싱 (full에서만 렌더링, dev는 빈 Application)
                - chart: tempo
                  namespace: monitoring
                  serverSideApply: "false"
                - chart: otel-collector
                  namespace: monitoring
                  serverSideApply: "false"
                # 항목 4: 개별 Application(backup/argocd-application.yaml)에서 Helm 차트로 전환
                - chart: backup
                  namespace: storage
                  serverSideApply: "false"
                # 항목 6: ArgoCD 설치가 만든 Notifications ConfigMap을 이어받으므로 SSA
                - chart: argocd-notifications
                  namespace: gitops
                  serverSideApply: "true"
  template:
    metadata:
      name: '{{ .chart }}'
      namespace: gitops
      labels:
        app.kubernetes.io/part-of: platform
    spec:
      project: default
      source:
        repoURL: http://gitlab.local:8929/root/kim-minji-infra.git
        targetRevision: HEAD
        path: '{{ .chart }}'
        helm:
          releaseName: '{{ .chart }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - 'values-{{ with .metadata }}{{ with .labels }}{{ with .env }}{{ . }}{{ else }}dev{{ end }}{{ else }}dev{{ end }}{{ else }}dev{{ end }}.yaml'
            # 실험 오버레이 (RUNBOOK 4.15): 클러스터 experiment 라벨(baseline | cb | mesh | mesh-retry). 라벨이 없거나 파일이 없는 차트는 무시
            - 'values-exp-{{ with .metadata }}{{ with .labels }}{{ with .experiment }}{{ . }}{{ else }}none{{ end }}{{ else }}none{{ end }}{{ else }}none{{ end }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # 첫 설치 때 webhook CA 주입 지연(cert-manager, metallb) 등으로 실패한 sync를 자동으로 다시 시도한다
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  # coredns(k3s Deployment 부분 패치), CRD가 큰 차트(calico, monitoring, metallb, cert-manager, longhorn, traefik, istio)는 Server-Side Apply 필요
  templatePatch: |
    {{- if eq .serverSideApply "true" }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          {{- if eq .chart "istio" }}
          - RespectIgnoreDifferences=true
          {{- end }}
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      {{- if eq .chart "istio" }}
      # istiod가 실행 중에 webhook의 caBundle·failurePolicy를 직접 채운다. Git 값으로 되돌리며 계속 OutOfSync가 되지 않게 무시한다
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.failurePolicy
      {{- end }}
    {{- end }}
