# 클러스터 공통 인프라(kim-minji-infra 차트)를 프로파일별로 배포한다.
# 프로파일: in-cluster 클러스터 Secret의 env 라벨 (dev | full). 라벨이나 Secret이 없으면 dev.
#   values.yaml(공통) → values-<env>.yaml(있으면) 순서로 덮어쓴다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: gitops
spec:
  goTemplate: true
  syncPolicy:
    # ApplicationSet을 지워도 이미 배포된 리소스는 남긴다
    preserveResourcesOnDeletion: true
  generators:
    # 주의: clusters 생성기도 .name(클러스터 이름)을 내보내고 matrix에서 우선한다. 차트 이름은 .chart로 쓴다.
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                # 플랫폼 기반 (항목 2): 다른 앱보다 먼저 준비돼야 한다. 순서 제어는 sync wave 항목에서 다룬다
                - chart: sealed-secrets
                  namespace: kube-system
                  serverSideApply: "false"
                - chart: metallb
                  namespace: metallb-system
                  serverSideApply: "true"
                - chart: cert-manager
                  namespace: cert-manager
                  serverSideApply: "true"
                - chart: longhorn
                  namespace: longhorn-system
                  serverSideApply: "true"
                - chart: traefik
                  namespace: traefik
                  serverSideApply: "true"
                - chart: coredns
                  namespace: kube-system
                  serverSideApply: "true"
                - chart: node-local-dns
                  namespace: kube-system
                  serverSideApply: "false"
                - chart: network-policy
                  namespace: default
                  serverSideApply: "false"
                - chart: ingress
                  namespace: application
                  serverSideApply: "false"
                - chart: monitoring
                  namespace: monitoring
                  serverSideApply: "true"
                - chart: loki
                  namespace: monitoring
                  serverSideApply: "false"
                # 항목 4: 개별 Application(backup/argocd-application.yaml)에서 Helm 차트로 전환
                - chart: backup
                  namespace: storage
                  serverSideApply: "false"
                # 항목 6: ArgoCD 설치가 만든 Notifications ConfigMap을 이어받으므로 SSA
                - chart: argocd-notifications
                  namespace: gitops
                  serverSideApply: "true"
  template:
    metadata:
      name: '{{ .chart }}'
      namespace: gitops
      labels:
        app.kubernetes.io/part-of: platform
    spec:
      project: default
      source:
        repoURL: http://gitlab.local:8929/root/kim-minji-infra.git
        targetRevision: HEAD
        path: '{{ .chart }}'
        helm:
          releaseName: '{{ .chart }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - 'values-{{ with .metadata }}{{ with .labels }}{{ with .env }}{{ . }}{{ else }}dev{{ end }}{{ else }}dev{{ end }}{{ else }}dev{{ end }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # 첫 설치 때 webhook CA 주입 지연(cert-manager, metallb) 등으로 실패한 sync를 자동으로 다시 시도한다
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  # coredns(k3s Deployment 부분 패치), CRD가 큰 차트(monitoring, metallb, cert-manager, longhorn, traefik)는 Server-Side Apply 필요
  templatePatch: |
    {{- if eq .serverSideApply "true" }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
    {{- end }}
