{{- if not (get .Values.sealedSecret.encryptedData "slack-webhook-url") }}
{{- fail "sealedSecret.encryptedData.slack-webhook-url is required (kubeseal로 암호화한 Slack Incoming Webhook URL, RUNBOOK 5.4)" }}
{{- end }}
# ArgoCD Notifications가 읽는 Secret 이름은 argocd-notifications-secret으로 고정이다
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-notifications-secret
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: argocd-notifications-secret
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: argocd
    type: Opaque
