# Ingress 컨트롤러 (ingress-nginx 대체). k3s 내장 traefik은 꺼야 한다 (RUNBOOK 4장).
traefik:
  deployment:
    replicas: 1

  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik

  ports:
    web:
      # 기존 접속 주소(*.wafer.local:32088)를 유지한다
      nodePort: 32088
      # 모든 HTTP 요청을 HTTPS로 리다이렉트한다 (frontend의 Grafana iframe·API 호출이 혼합 콘텐츠로 막히지 않게)
      # to: websecure → 443으로 보낸다(MetalLB LB IP 접속 기준). 차트는 to에 포트 번호를 받지 않으므로
      # NodePort로만 접속한다면 이 블록 대신 additionalArguments로 :32443 리다이렉트를 건다 (RUNBOOK C13)
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      nodePort: 32443

  # MetalLB가 IP를 할당한다. IP가 정해지면 /etc/hosts를 그 IP로 바꿀 수 있다 (RUNBOOK C9)
  service:
    spec:
      type: LoadBalancer

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
