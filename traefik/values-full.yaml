# full 프로파일: replica 2, 노드 분산, PDB
traefik:
  deployment:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # AI 전용 노드(k3s-ai2)에는 두지 않는다 (PreferNoSchedule taint는 분산 계산에서 빠지지 않으므로 nodeAffinity로 제외)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k3s-ai2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      # cordon·NotReady 노드(NoSchedule/NoExecute taint)는 분산 계산에서 빼서, 노드 1대가 내려가도 롤링 업데이트가 멈추지 않게 한다
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-traefik
  # 진입점(Traefik)에서 trace를 시작해 backend·ai-serving으로 traceparent를 넘긴다
  tracing:
    serviceName: traefik
    otlp:
      enabled: true
      http:
        enabled: true
        endpoint: http://otel-collector.monitoring.svc:4318/v1/traces
