# full 프로파일: replica 2, 노드 분산, PDB
traefik:
  deployment:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      # cordon·NotReady 노드는 분산 계산에서 빼서, 노드 1대가 내려가도 롤링 업데이트가 멈추지 않게 한다
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-traefik
