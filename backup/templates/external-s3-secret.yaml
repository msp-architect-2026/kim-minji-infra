{{- if .Values.external.enabled }}
{{- if or (contains "PLACEHOLDER" .Values.external.endpoint) (contains "PLACEHOLDER" .Values.external.bucket) }}
{{- fail "external.endpoint/bucket이 placeholder다. 값을 채우거나 external.enabled: false로 둔다 (RUNBOOK C16)" }}
{{- end }}
{{- $enc := .Values.external.sealedSecret.encryptedData -}}
{{- range $k := list "accessKey" "secretKey" }}
{{- if not (get $enc $k) }}
{{- fail (printf "external.sealedSecret.encryptedData.%s is required (kubeseal로 암호화한 값, RUNBOOK 5.3)" $k) }}
{{- end }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.external.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{- toYaml $enc | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.external.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
