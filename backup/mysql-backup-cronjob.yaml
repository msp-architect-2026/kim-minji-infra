apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: storage
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mysql-backup
            image: gitlab.local:5050/root/kim-minji-infra/mysql-backup:latest
            imagePullPolicy: Always
            command:
            - /bin/sh
            - -c
            - |
              # 덤프·업로드가 실패하면 Job도 실패로 끝나게 한다 (빈 덤프 업로드 방지, 실패 알림 대상)
              set -eu
              DATE=$(date +%Y%m%d_%H%M%S)
              FILENAME=backup_${DATE}.sql
              echo "백업 시작: ${FILENAME}"
              # 비밀번호는 명령행 대신 MYSQL_PWD 환경변수로 전달 (ps에 노출 방지)
              MYSQL_PWD="$MYSQL_PASSWORD" mysqldump -h mysql-mysql.storage.svc.cluster.local \
                -u "$MYSQL_USER" --no-tablespaces "$MYSQL_DATABASE" > /tmp/${FILENAME}
              mc alias set local http://minio-minio.storage.svc.cluster.local:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              mc cp /tmp/${FILENAME} local/wafer-backup/${FILENAME}
              echo "백업 완료: wafer-backup/${FILENAME}"
            env:
            # 계정 정보는 같은 storage 네임스페이스의 Secret(SealedSecret으로 관리)에서 읽는다
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secretKey
          imagePullSecrets:
          - name: gitlab-registry-secret
          restartPolicy: OnFailure