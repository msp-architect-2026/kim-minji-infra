# 백업 도구 이미지 (debian + mariadb-client + mc, backup/Dockerfile → infra CI가 빌드)
image: gitlab.local:5050/root/kim-minji-infra/mysql-backup:latest

schedule:
  mysql: "0 2 * * *"
  minio: "0 3 * * *"
  # 매주 일요일: 가장 최근 덤프를 임시 DB에 복원해 검증
  restoreCheck: "0 4 * * 0"

mysql:
  host: mysql-mysql.storage.svc.cluster.local
  # 계정은 mysql 차트의 SealedSecret(mysql-secret)을 그대로 읽는다
  secretName: mysql-secret

minio:
  endpoint: http://minio-minio.storage.svc.cluster.local:9000
  secretName: minio-secret
  buckets:
    - wafer-images
    - wafer-model
  # 클러스터 안 1차 백업 위치 (빠른 복원용)
  backupBucket: wafer-backup
  localRetentionDays: 7

# 클러스터 밖 S3 호환 저장소 (AWS S3, Backblaze B2, Cloudflare R2, NAS의 S3, 맥 호스트 MinIO 등)
# 노드(w1)가 통째로 사라져도 남는 2차 백업. 값은 RUNBOOK C16에서 확정한다
external:
  enabled: true
  endpoint: https://PLACEHOLDER-S3-ENDPOINT   # 예: https://s3.ap-northeast-2.amazonaws.com
  bucket: PLACEHOLDER-BUCKET
  prefix: wafer
  retentionDays: 14
  secretName: backup-s3
  # kubeseal로 암호화한 값 (accessKey, secretKey). 생성 방법: RUNBOOK 5.3
  sealedSecret:
    encryptedData: {}
      # accessKey: AgB...
      # secretKey: AgB...
